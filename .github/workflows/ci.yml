name: CI e site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Regera o site toda segunda-feira, para as datas de vigência acompanharem o calendário.
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: upstream/*/pom.xml

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: upstream/gerador-danfse/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - name: Compilar APIs (banco, JARs, DANFSe e WASM)
        run: ./scripts/build.sh

      - name: Compilar MCP
        working-directory: mcp-server
        run: npm ci && npm run build

      - name: Subir APIs
        run: |
          nohup ./scripts/run.sh > apis.log 2>&1 &
          for i in $(seq 1 60); do
            a=$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/api/api-docs || true)
            b=$(curl -s -o /dev/null -w '%{http_code}' localhost:8082/api/api-docs || true)
            c=$(curl -s -o /dev/null -w '%{http_code}' localhost:8090/health/ready || true)
            p=$(curl -s -o /dev/null -w '%{http_code}' localhost:8079/health || true)
            [ "$a$b$c$p" = "200200200200" ] && exit 0
            sleep 3
          done
          cat apis.log; exit 1

      - name: Teste de fumaça do MCP
        working-directory: mcp-server
        run: npm run smoke

      - name: Gerar dados do site
        run: node scripts/export-site-data.mjs

      - name: Publicar WASM do DANFSe como artefato
        uses: actions/upload-artifact@v4
        with:
          name: danfse-wasm
          path: |
            dist/danfse.wasm
            dist/wasm_exec.js

      - name: Empacotar site para o GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    needs: build-and-smoke
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
