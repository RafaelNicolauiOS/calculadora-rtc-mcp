name = "calculadora-rtc-mcp"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[r2_buckets]]
binding = "PDFS"
bucket_name = "calculadora-rtc-danfse-pdf"

[[services]]
binding = "DANFSE"
service = "calculadora-rtc-danfse"

[triggers]
crons = ["0 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
